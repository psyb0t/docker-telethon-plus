title: telethon-plus
tagline: Your Telegram account over HTTP and MCP
description: Telethon, the MTProto userbot client, behind a JSON HTTP API and an MCP endpoint, with flood protection, an entity cache and live updates.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-telethon-plus
repository: psyb0t/docker-telethon-plus
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-telethon-plus
  Docker Hub:
    - https://hub.docker.com/r/psyb0t/telethon-plus
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-telethon-plus/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/docker-telethon-plus
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
